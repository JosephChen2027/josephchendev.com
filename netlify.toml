# netlify.toml — josephchendev.com
# Static portfolio. No build step; Netlify just serves the directory.
# Apex (https://josephchendev.com) is canonical; www redirects to apex.

[build]
  publish = "."
  # No build command — pure static.

# ───────────────────────────────────────────────────────────────
# Security headers (apply to every path, then narrower rules add caching)
# ───────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS — 2 years, includeSubDomains, preload-eligible.
    # ⚠️  Only enable preload after you've confirmed the site (and any
    #     subdomains you plan to use) work fully on HTTPS.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Block MIME sniffing.
    X-Content-Type-Options = "nosniff"

    # Disallow framing (clickjacking protection).
    X-Frame-Options = "DENY"

    # Send the origin only on cross-origin navigation; full URL same-origin.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable powerful browser features the portfolio doesn't use.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"

    # Cross-origin isolation (defence-in-depth; safe for static portfolio).
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

    # Content Security Policy.
    # script-src: 'self' covers script.js. 'unsafe-inline' is required for the
    #             JSON-LD <script type="application/ld+json"> blob in index.html.
    #             (JSON-LD is data, not executable, so this isn't an XSS vector.)
    #             Tighten later by replacing 'unsafe-inline' with sha256-hashes.
    # style-src:  Google Fonts CSS is loaded via <link rel="stylesheet">.
    # font-src:   Google Fonts WOFF2 files are served from fonts.gstatic.com.
    # img-src:    'self' + data: for inline SVG/data URIs.
    # connect-src: 'self' only — no analytics yet. Add Plausible / CF Insights here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; object-src 'none'; upgrade-insecure-requests"

# ───────────────────────────────────────────────────────────────
# Caching — long-cache hashed assets, no-cache HTML so changes ship fast.
# ───────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Disposition = "inline; filename=\"joseph_chen_resume.pdf\""

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ───────────────────────────────────────────────────────────────
# Redirects
# ───────────────────────────────────────────────────────────────
# Force apex as canonical. (Netlify's domain UI also handles this, but
# being explicit guarantees behaviour even if you rewire DNS later.)
[[redirects]]
  from = "https://www.josephchendev.com/*"
  to = "https://josephchendev.com/:splat"
  status = 301
  force = true

# Friendly /cv alias → /resume.pdf
[[redirects]]
  from = "/cv"
  to = "/resume.pdf"
  status = 301

# Custom 404 (Netlify auto-serves /404.html, but be explicit).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
